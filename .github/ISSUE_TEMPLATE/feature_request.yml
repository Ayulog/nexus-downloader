name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what's missing or annoying right now?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? New config options, CLI flags or changes to the terminal view are all fine to describe here.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other approaches you've considered.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This doesn't ask for bypassing account limits, paid features or rate limits, or anything else against the Nexus Mods Terms of Service
          required: true
